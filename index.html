import json
import random
import math
from datetime import datetime, timedelta

def run_simulation():
    # 1. Load Real BTC Data
    ohlcv = json.loads(price_data_json)

    # 2. Technical Indicators
    def calculate_sma(data, window):
        sma = [None] * len(data)
        for i in range(window - 1, len(data)):
            sma[i] = sum(d["close"] for d in data[i-window+1:i+1]) / window
        return sma

    def calculate_rsi(data, window=14):
        rsi = [None] * len(data)
        deltas = []
        for i in range(1, len(data)):
            deltas.append(data[i]["close"] - data[i-1]["close"])

        for i in range(window, len(data)):
            wins = [d for d in deltas[i-window:i] if d > 0]
            losses = [abs(d) for d in deltas[i-window:i] if d < 0]

            avg_gain = sum(wins) / window
            avg_loss = sum(losses) / window

            if avg_loss == 0:
                rsi[i] = 100
            else:
                rs = avg_gain / avg_loss
                rsi[i] = 100 - (100 / (1 + rs))
        return rsi

    def calculate_bollinger_bands(data, window=20, num_std=2):
        upper = [None] * len(data)
        lower = [None] * len(data)
        for i in range(window - 1, len(data)):
            window_prices = [d["close"] for d in data[i-window+1:i+1]]
            ma = sum(window_prices) / window
            variance = sum((x - ma) ** 2 for x in window_prices) / window
            std = math.sqrt(variance)
            upper[i] = ma + (num_std * std)
            lower[i] = ma - (num_std * std)
        return upper, lower

    sma7 = calculate_sma(ohlcv, 7)
    sma30 = calculate_sma(ohlcv, 30)
    rsi14 = calculate_rsi(ohlcv, 14)
    bb_upper, bb_lower = calculate_bollinger_bands(ohlcv, 20)

    # 3. Trading Algorithm
    cash = 10000.0
    btc_held = 0.0
    ledger = []

    bh_btc_held = 10000.0 / ohlcv[0]["close"]

    max_portfolio_value = 10000.0
    max_drawdown = 0.0

    for i in range(len(ohlcv)):
        price = ohlcv[i]["close"]
        s7 = sma7[i]
        s30 = sma30[i]
        r14 = rsi14[i]

        signal = "HOLD"

        # Check signals if we have indicators
        if s7 is not None and s30 is not None and r14 is not None:
            prev_s7 = sma7[i-1]
            prev_s30 = sma30[i-1]

            if prev_s7 is not None and prev_s30 is not None:
                # BUY: SMA7 crosses above SMA30 AND RSI < 70
                if prev_s7 <= prev_s30 and s7 > s30 and r14 < 70:
                    if cash > 0:
                        btc_held = cash / price
                        cash = 0
                        signal = "BUY"

                # SELL: SMA7 crosses below SMA30 AND RSI > 30
                elif prev_s7 >= prev_s30 and s7 < s30 and r14 > 30:
                    if btc_held > 0:
                        cash = btc_held * price
                        btc_held = 0
                        signal = "SELL"
                    # A better win check would compare sell price to entry price.
                    # Let's track entry price.

        portfolio_value = cash + (btc_held * price)
        max_portfolio_value = max(max_portfolio_value, portfolio_value)
        drawdown = (max_portfolio_value - portfolio_value) / max_portfolio_value
        max_drawdown = max(max_drawdown, drawdown)

        ledger.append({
            "date": ohlcv[i]["date"],
            "close": price,
            "sma7": s7,
            "sma30": s30,
            "rsi": r14,
            "bb_upper": bb_upper[i],
            "bb_lower": bb_lower[i],
            "signal": signal,
            "cash": cash,
            "btc_held": btc_held,
            "portfolio_value": portfolio_value,
            "bh_value": bh_btc_held * price
        })

    # Stats Calculation
    final_value = ledger[-1]["portfolio_value"]
    total_return = (final_value - 10000) / 10000
    bh_final_value = ledger[-1]["bh_value"]
    bh_return = (bh_final_value - 10000) / 10000
    alpha = total_return - bh_return

    # Win rate and Sharpe (approximation)
    # Re-calculate win rate properly
    entry_price = 0
    win_count = 0
    trade_count = 0
    for entry in ledger:
        if entry["signal"] == "BUY":
            entry_price = entry["close"]
        elif entry["signal"] == "SELL" and entry_price > 0:
            trade_count += 1
            if entry["close"] > entry_price:
                win_count += 1
            entry_price = 0

    win_rate = (win_count / trade_count) if trade_count > 0 else 0

    # Sharpe Ratio Approximation (Daily returns)
    daily_returns = []
    for i in range(1, len(ledger)):
        ret = (ledger[i]["portfolio_value"] - ledger[i-1]["portfolio_value"]) / ledger[i-1]["portfolio_value"]
        daily_returns.append(ret)

    avg_daily_ret = sum(daily_returns) / len(daily_returns)
    std_daily_ret = math.sqrt(sum((x - avg_daily_ret)**2 for x in daily_returns) / len(daily_returns))
    sharpe = (avg_daily_ret / std_daily_ret) * math.sqrt(365) if std_daily_ret > 0 else 0

    return json.dumps({
        "ledger": ledger,
        "stats": {
            "final_portfolio_value": final_value,
            "total_return_pct": total_return * 100,
            "bh_return_pct": bh_return * 100,
            "alpha_pct": alpha * 100,
            "total_trades": trade_count,
            "win_rate_pct": win_rate * 100,
            "max_drawdown_pct": max_drawdown * 100,
            "sharpe_ratio": sharpe
        }
    })

# Call the function from JS
run_simulation

    <script>
        let pyodide;
        let simulationData = null;
        let currentPage = 1;
        const rowsPerPage = 30;

        const runBtn = document.getElementById('run-btn');
        const loading = document.getElementById('loading');
        const loadingText = loading.querySelector('span');
        const updateDateSpan = document.getElementById('update-date');
        const tickerContent = document.getElementById('ticker-content');

        // Charts
        let priceChart = null;
        let portfolioChart = null;
        let tickerClone = null;

        async function initPyodide() {
            if (pyodide) return;
            loading.classList.remove('hidden');
            loadingText.innerText = "Loading Pyodide...";
            pyodide = await loadPyodide({
                indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/"
            });
            loadingText.innerText = "Pyodide Ready.";
            loading.classList.add('hidden');
        }

        async function fetchBTCData() {
            loading.classList.remove('hidden');
            loadingText.innerText = "Fetching real BTC data from CoinGecko...";
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=1095&interval=daily');
                if (!response.ok) {
                    throw new Error(`CoinGecko API error: ${response.status} ${response.statusText}`);
                }
                const data = await response.json();

                if (!data.prices || !Array.isArray(data.prices)) {
                    throw new Error("Invalid data format received from CoinGecko.");
                }

                // data.prices is [[timestamp, price], ...]
                const ohlcv = [];
                for (let i = 0; i < data.prices.length; i++) {
                    const [ts, price] = data.prices[i];
                    // Use UTC date to avoid timezone shifts
                    const date = new Date(ts).toISOString().split('T')[0];
                    const prevClose = i > 0 ? data.prices[i-1][1] : price;

                    ohlcv.push({
                        date: date,
                        open: prevClose,
                        high: price * 1.01,
                        low: price * 0.99,
                        close: price,
                        volume: 0
                    });
                }
                return ohlcv;
            } catch (error) {
                console.error("Failed to fetch data:", error);
                throw error;
            }
        }

        async function runSimulation() {
            await initPyodide();

            runBtn.disabled = true;

            try {
                const ohlcv = await fetchBTCData();
                loadingText.innerText = "Running simulation...";

                pyodide.globals.set('price_data_json', JSON.stringify(ohlcv));

                const pythonCode = document.getElementById('python-code').textContent;
                await pyodide.runPythonAsync(pythonCode);
                const resultJson = await pyodide.runPythonAsync(`run_simulation()`);
                simulationData = JSON.parse(resultJson);

                updateDateSpan.innerText = new Date().toLocaleDateString();
                updateUI();
                startTicker();
            } catch (error) {
                console.error("Simulation failed:", error);
                alert("Simulation failed. Check console for details.");
            } finally {
                runBtn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function updateUI() {
            renderStats();
            renderCharts();
            currentPage = 1;
            renderLedger();
        }

        function renderStats() {
            const stats = simulationData.stats;
            const container = document.getElementById('stats-dashboard');

            const cards = [
                { label: "Final Portfolio", value: `$${stats.final_portfolio_value.toLocaleString(undefined, {maximumFractionDigits: 2})}`, color: "var(--neon-green)" },
                { label: "Total Return", value: `${stats.total_return_pct.toFixed(2)}%`, color: stats.total_return_pct >= 0 ? "var(--neon-green)" : "var(--neon-red)" },
                { label: "Buy & Hold Return", value: `${stats.bh_return_pct.toFixed(2)}%`, color: "var(--text-secondary)" },
                { label: "Alpha", value: `${stats.alpha_pct.toFixed(2)}%`, color: stats.alpha_pct >= 0 ? "var(--neon-green)" : "var(--neon-red)" },
                { label: "Total Trades", value: stats.total_trades, color: "var(--electric-blue)" },
                { label: "Win Rate", value: `${stats.win_rate_pct.toFixed(2)}%`, color: "var(--electric-blue)" },
                { label: "Max Drawdown", value: `${stats.max_drawdown_pct.toFixed(2)}%`, color: "var(--neon-red)" },
                { label: "Sharpe Ratio", value: stats.sharpe_ratio.toFixed(2), color: "var(--electric-blue)" }
            ];

            container.innerHTML = cards.map(card => `
                <div class="stat-card">
                    <span class="stat-label">${card.label}</span>
                    <span class="stat-value" style="color: ${card.color}">${card.value}</span>
                </div>
            `).join('');
        }

        function renderCharts() {
            const ledger = simulationData.ledger;
            const labels = ledger.map(d => d.date);

            // Price Chart
            if (priceChart) priceChart.destroy();
            const priceCtx = document.getElementById('price-chart').getContext('2d');

            const buySignals = ledger.map(d => d.signal === 'BUY' ? d.close : null);
            const sellSignals = ledger.map(d => d.signal === 'SELL' ? d.close : null);

            priceChart = new Chart(priceCtx, {
                type: 'line',

                    labels: labels,

                            borderWidth: 1.5,
                            pointRadius: 0,

                        },
                        {

                        },
                        {

                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 0.5,
                            pointRadius: 0,
                            fill: false,
                            order: 7
                        },
                        {
                            label: 'SMA7',
                            data: ledger.map(d => d.sma7),
                            borderColor: 'orange',
                            borderWidth: 1,
                            pointRadius: 0,
                            order: 4
                        },
                        {
                            label: 'SMA30',
                            data: ledger.map(d => d.sma30),
                            borderColor: 'var(--electric-blue)',
                            borderWidth: 1,
                            pointRadius: 0,
                            order: 5
                        },
                        {
                            label: 'BUY',
                            data: buySignals,
                            pointStyle: 'triangle',
                            pointRadius: 8,
                            backgroundColor: 'var(--neon-green)',
                            borderColor: 'var(--neon-green)',
                            showLine: false,
                            order: 1
                        },
                        {
                            label: 'SELL',
                            data: sellSignals,
                            pointStyle: 'triangle',
                            rotation: 180,
                            pointRadius: 8,
                            backgroundColor: 'var(--neon-red)',
                            borderColor: 'var(--neon-red)',
                            showLine: false,

                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {

                    }
                }
            });

            // Portfolio Chart
            if (portfolioChart) portfolioChart.destroy();
            const portCtx = document.getElementById('portfolio-chart').getContext('2d');

            portfolioChart = new Chart(portCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Algo Strategy',
                            data: ledger.map(d => d.portfolio_value),
                            borderColor: 'var(--neon-green)',
                            borderWidth: 2,
                            pointRadius: 0
                        },
                        {
                            label: 'Buy & Hold BTC',
                            data: ledger.map(d => d.bh_value),
                            borderColor: '#666',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#a0a0b0', font: { family: 'JetBrains Mono' } } }
                    },
                    scales: {
                        x: { ticks: { color: '#666' }, grid: { color: '#1a1a2a' } },
                        y: { ticks: { color: '#666' }, grid: { color: '#1a1a2a' } }
                    }
                }
            });
        }

        function renderLedger() {
            const ledger = simulationData.ledger;
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = ledger.slice(start, end);

            const tbody = document.getElementById('ledger-body');
            tbody.innerHTML = pageData.map(row => {
                let signalBadge = '<span class="signal-badge badge-hold">⚪ HOLD</span>';
                let rowClass = '';
                if (row.signal === 'BUY') {
                    signalBadge = '<span class="signal-badge badge-buy">🟢 BUY</span>';
                    rowClass = 'row-buy';
                } else if (row.signal === 'SELL') {
                    signalBadge = '<span class="signal-badge badge-sell">🔴 SELL</span>';
                    rowClass = 'row-sell';
                }

                return `
                    <tr class="${rowClass}">
                        <td>${row.date}</td>
                        <td>${row.close.toFixed(2)}</td>
                        <td>${row.sma7 ? row.sma7.toFixed(2) : '-'}</td>
                        <td>${row.sma30 ? row.sma30.toFixed(2) : '-'}</td>
                        <td>${row.rsi ? row.rsi.toFixed(2) : '-'}</td>
                        <td>${signalBadge}</td>
                        <td>${row.cash.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
                        <td>${row.btc_held.toFixed(4)}</td>
                        <td><strong>${row.portfolio_value.toLocaleString(undefined, {maximumFractionDigits: 2})}</strong></td>
                    </tr>
                `;
            }).join('');

            const totalPages = Math.ceil(ledger.length / rowsPerPage);
            document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
        }

        function startTicker() {
            const last20 = simulationData.ledger.slice(-20);
            tickerContent.innerHTML = '';
            last20.forEach(d => {
                const item = document.createElement('div');
                item.className = 'ticker-item';
                item.innerHTML = `BTC/USD <span>$${d.close.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>`;
                tickerContent.appendChild(item);
            });

            if (!tickerClone) {
                tickerClone = tickerContent.cloneNode(true);
                tickerClone.id = '';
                tickerContent.parentElement.appendChild(tickerClone);
            }
            tickerClone.innerHTML = tickerContent.innerHTML;
        }

        function exportCSV() {
            if (!simulationData) return;
            const ledger = simulationData.ledger;
            const headers = ["Date", "Close", "SMA7", "SMA30", "RSI", "Signal", "Cash", "BTC Held", "Portfolio Value"];
            const csvRows = [headers.join(",")];

            ledger.forEach(row => {
                csvRows.push([
                    row.date,
                    row.close,
                    row.sma7 || "",
                    row.sma30 || "",
                    row.rsi || "",
                    row.signal,
                    row.cash,
                    row.btc_held,
                    row.portfolio_value
                ].join(","));
            });

            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `btc_backtest_${Date.now()}.csv`);
            a.click();
        }

        // Event Listeners
        runBtn.addEventListener('click', runSimulation);
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderLedger();
            }
        });
        document.getElementById('next-btn').addEventListener('click', () => {
            const totalPages = Math.ceil(simulationData.ledger.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderLedger();
            }
        });
        document.getElementById('export-btn').addEventListener('click', exportCSV);

        // Initial Load
        window.addEventListener('load', initPyodide);
    </script>
</body>
</html>
